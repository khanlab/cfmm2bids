# config/trident/exvivo_15T.yml
# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Final output directory for the BIDS dataset (REQUIRED)
# Absolute or relative paths can be used, will be relative to working folder
# Default: "bids"
final_bids_dir: /nfs/khan/trainees/larcamon/khanproject/DATA/Khan_Trip_KI_Char_exvivo_dev

stages:
  query: /nfs/khan/trainees/larcamon/khanproject/DATA/Khan_Trip_KI_Char_exvivo_dev/0_query
  filter: /nfs/khan/trainees/larcamon/khanproject/DATA/Khan_Trip_KI_Char_exvivo_dev/1_filter
  download: /nfs/khan/trainees/larcamon/khanproject/DATA/Khan_Trip_KI_Char_exvivo_dev/2_download
  convert: /nfs/khan/trainees/larcamon/khanproject/DATA/Khan_Trip_KI_Char_exvivo_dev/3_convert
  fix: /nfs/khan/trainees/larcamon/khanproject/DATA/Khan_Trip_KI_Char_exvivo_dev/4_fix

# Final output directory for the uncorrected BIDS dataset (OPTIONAL)
# Only used when gradcorrect is enabled and gradcorrect.create_bids_uncorr is true.
# Default: "bids_uncorr"
# final_bids_uncorr_dir: "bids_uncorr"

# Force re-query of DICOM server (OPTIONAL, default: false)
# By default, if the query results (studies.tsv) already exist and the
# query parameters haven't changed, the workflow will skip re-querying.
# Set to true to always query the DICOM server (e.g., when new scans
# may have been acquired since the last query).
# Can also be set via CLI: snakemake --config force_requery=true
force_requery: true


# ── Heuristique ──────────────────────────────────────────────────────────────
heuristic: heuristics/exvivo_15T.py
dcmconfig_json: resources/dcm2niix_config.json
heudiconv_options: "--minmeta --use-enhanced-dicom"

# ── Query DICOM ──────────────────────────────────────────────────────────────
search_specs:
  - dicom_query:
      study_description: "Khan^Trip-KI-Char-exvivo"   
      study_date: "20260601-"               
    metadata_mappings:
      subject:
        source: PatientName
        sanitize: true
      session:
        constant: "exvivo15T"

# ── Filtres post-query ────────────────────────────────────────────────────────
study_filter_specs:
  include: []
  exclude: []

# ── Download ──────────────────────────────────────────────────────────────────
credentials_file: ~/.uwo_credentials
cfmm2tar_download_options: "--skip-derived"
merge_duplicate_studies: false
download_cache: /nfs/khan/trainees/larcamon/khanproject/DATA/Khan_Trip_KI_Char_exvivo/download_cache

# ── Fixes post-conversion ─────────────────────────────────────────────────────
post_convert_fixes:
  - name: remove_dwi_bval_bvec
    pattern: "dwi/*.bval"
    action: remove
  - name: remove_dwi_bvec
    pattern: "dwi/*.bvec"
    action: remove
  - name: add_bidsignore
    pattern: "**/*MTw*"
    action: remove 
  - name: add_resolution_json_ogse
    pattern: "dwi/*acq-multidwienc_res-150iso_dwi.json"
    action: update_json
    updates:
      Resolution: "150iso"
  - name: add_resolution_json_t1w_flash
    pattern: "anat/*acq-flash_res-50iso_T1w.json"
    action: update_json
    updates:
      Resolution: "50iso"
  - name: add_resolution_json_t1w_refmt
    pattern: "anat/*acq-refMT_res-100iso_T1w.json"
    action: update_json
    updates:
      Resolution: "100iso"
  - name: add_resolution_json_t2w
    pattern: "anat/*acq-rare_res-100iso_T2w.json"
    action: update_json
    updates:
      Resolution: "100iso"
    
  # Add the import regenerated bval/bvec here, if necessary :
  # - name: import_bval_b2kb4kb6k
  #   action: copy_from_path
  #   src: "/path/to/bval_bvec/acq-b2kb4kb6k_dwi.bval"
  #   dst: "dwi/sub-{subject}_ses-{session}_acq-b2kb4kb6k_dwi.bval"
  #   required: true


default-resources:
  slurm_extra: "'--export=UWO_USERNAME,UWO_PASSWORD'"
