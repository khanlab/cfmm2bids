# general 
credentials_file: ~/.uwo_credentials.bd
final_bids_dir: "/nfs/trident3/mri/prado/lecanemab_early/bids"

# 1. query
search_specs:
  - dicom_query:
      study_description:  "Prado^Leq_AB_agg"
    select:
      - AppKI2.hTau.APOE*4_64-5F2
      - AppKI2.hTau.APOE*4_71-2M1
      - AppKI2.hTau.APOE*4_71-2M2
      - AppKI2.hTau.APOE*4_71-2M3
      - AppKI2.hTau.APOE*4_71-2F4
      - AppKI2.hTau.APOE*4_71-2F5
      - AppKI2.hTau.APOE*4_71-2F6
      - AppKI2.hTau.APOE*4_71-2F7

    metadata_mappings:
      subject:
        source: PatientName
        pattern: '4_([0-9]+-[0-9][MF][0-9])$'
        sanitize: false
        # constant: 'pilot'  # Use constant value for all subjects (OPTIONAL)
        map:
          '64-5F2':  AS303F2
          '71-2M1':  AS305M1
          '71-2M2':  AS305M2
          '71-2M3':  AS305M3
          '71-2F4':  AS306F4
          '71-2F5':  AS306F5
          '71-2F6':  AS306F6
          '71-2F7':  AS306F7
      session:
        source: StudyDate


  - dicom_query:
      study_description:  "Prado^Leq_AB_agg"
    select:
      - AS454M3
      - AS454M4
      - AS454M7
      - AS438F7
      - AS438F8
      - AS438F9
      - AS438F10
      - As436M1
      - AS436M2
      - AS436M3
      - AS436M4
      - AS453F1
      - AS453F2
      - AS453F2e
      - AS453F3
      - AS452M1
      - AS452M2
      - AS452M3
      - AS452M4
      - AS458F5
      - AS458F6
    metadata_mappings:
      subject:
        source: PatientName
        pattern: '([a-zA-Z0-9]+)$'
        sanitize: false
        # constant: 'pilot'  # Use constant value for all subjects (OPTIONAL)
        map:
          'As436M1': AS436M1
      session:
        source: StudyDate

  - dicom_query:
      study_description:  "Menon^AS-MBN"
    select:
      - AppKI2.hTau.APOE*4_35-7M#5_AS160M5
      - AppKI2.hTau.APOE*4_36-1M#1_AS160M1
      - AppKI2.hTau.APOE*4_36-1M#2_AS160M2
      - AppKI2.hTau.APOE*4_36-1M#3_AS160M3
      - AppKI2.hTau.APOE*4_36-1M#4_AS161M4
      - AppKI2.hTau.APOE*4_36-1M#5_AS161M5
      - AppKI2.hTau.APOE*4_39-1F#1_AS167F1
      - AppKI2.hTau.APOE*4_39-1F#5_AS167F5
      - AppKI2.hTau.APOE*4_39-1F#6_AS167F6
      - AppKI2.hTau.APOE*4_43-6M#4_AS209M4
      - AppKI2.hTau.APOE*4_43-6M#5_AS209M5
      - AppKI2.hTau.APOE*4_43-6M#6_AS209M5e
      - AppKI2.hTau.APOE*4_43-6M#7_AS209M7
      - AppKI2.hTau.APOE*4_46-3F#1_AS210F1
      - AppKI2.hTau.APOE*4_46-3F#3_AS210F3
      - AppKI2.hTau.APOE*4_46-3F#4_AS210F4
      - AppKI2.hTau.APOE*4_46-3F#6_AS210F6

    metadata_mappings:
      subject:
        source: PatientName
        pattern: '_(AS[0-9]+[MF][a-z0-9]+)$'
        sanitize: true
        remap:
          AS209M5e: AS209M6
      session:
        source: StudyDate


query_kwargs:
  additional_tags:
 #   "00100030": PatientBirthDate
  


# 2. filter
study_filter_specs:
  include:
  exclude:
    - "subject != subject"                  # Exclude if subject is NaN
  remap_sessions_by_date:
    # Enable/disable session remapping (REQUIRED if section is present)
    enable: true
    # Time units for intervals (OPTIONAL, default: 'months')
    # Options: 'days', 'months', 'years'
    units: 'months'
    
    # Rounding step for time intervals (OPTIONAL, default: 6)
    # For example, with units='months' and round_step=1:
    #   - Sessions will be labeled by rounded month intervals (0m, 1m, 2m, etc.)
    # Can also be a list for unequally-spaced timepoints, e.g. round_step: [0, 3, 6, 10]
    round_step: 3
    
    # Zero-pad session labels (OPTIONAL, default: false)
    # If true, pads session labels with leading zeros for proper alphanumeric sorting
    # Example: '00m', '06m', '12m' instead of '0m', '6m', '12m'
    #zero_pad: true
    
    # Reference date mode (OPTIONAL)
    # Default (commented out): Uses first session per subject as reference (baseline mode)
    # Alternative: Use PatientBirthDate to calculate age at scan
    # reference_col: 'PatientBirthDate'
    # reference_format: '%Y%m%d'
 
    # Mapping from numeric time intervals to session labels (OPTIONAL)
    # If not specified, generates labels like '0m', '6m', '12m' automatically
    # Custom mapping example (e.g., for time since baseline):
    time_to_label:
      0: '06m'
      3: '09m'
      6: '12m'
 
# 3. download
cfmm2tar_download_options: '--skip-derived'
merge_duplicate_studies: False  



# 4. convert
heudiconv_options: '--minmeta --use-enhanced-dicom --no-sanitize-jsons'
heuristic: heuristics/trident_15T.py
dcmconfig_json: resources/dcm2niix_config.json



# 5. fix 
post_convert_fixes:
  - name: phase_units
    pattern: "*/*_part-phase_*.json"
    action: update_json
    updates:
      Units: rad

  - name: reset_orientation
    pattern: "*/*.nii.gz"
    action: fix_orientation_quadruped


#intermediate output folders
stages:
  query: "results/lecanemab_early/0_query"
  filter: "results/lecanemab_early/1_filter"
  download: "results/lecanemab_early/2_download"
  convert: "results/lecanemab_early/3_convert"
  fix: "results/lecanemab_early/4_fix"

 
# Centralized download cache 
# Downloads are cached by StudyInstanceUID to avoid re-downloading
# the same data when subject/session mappings differ
# Default: "results/download_cache"
download_cache: "/nfs/trident3/mri/cfmm2bids/results/download_cache"
