# general 
credentials_file: ~/.uwo_credentials.bd
final_bids_dir: "/nfs/trident3/mri/prado/lecanemab_late/bids"

# 1. query
search_specs:

  - dicom_query:
      study_description:  "Prado^Leq_AB_agg" 
    select:
      - AS380F1
      - AS380F3e
      - AS381M4
      - AS381M5
      - AS381M6
      - AS391F1
      - AS391F2
      - AS400M1
      - AS400M2
      - AS395F1
      - AS395F2
      - AS395F3
      - AS395F4
      - AS401M5
      - AS401M6

    select_from_field: patient_name  # OPTIONAL, default: patient_name
    metadata_mappings:
      subject:
        source: PatientName
        sanitize: false
      session:
        source: StudyDate

  #these scans had different naming
  - dicom_query:
      study_description:  "Prado^Leq_AB_agg" 
    select:
      - 375-92-1-M1
      - 375-92-1-M2
      - 375-92-1-M3
      - 378-92-1-F7
      - 378-92-1-F8
      - 376-80-5-F1
      - 376-80-5-F2
    select_from_field: patient_name  # OPTIONAL, default: patient_name
    metadata_mappings:
      subject:
        source: PatientName
        pattern: '([0-9]+)-[0-9]+-[0-9]+-([MF][0-9])+$'
        replace: 'AS\1\2'
        sanitize: false
      session:
        source: StudyDate


  #these ones only have one 15m timepoint, so we fix that as constant
  - dicom_query:
      study_description:  "Prado^Leq_AB_agg" 
    select:
      - AS379M1
      - AS379M2
      - AS412M1
      - AS416M2
      - AS416M1
      - AS426M1
      - AS426M3
      - AS426M4
      - AS426M5      
    select_from_field: patient_name  # OPTIONAL, default: patient_name
    metadata_mappings:
      subject:
        source: PatientName
        sanitize: false

      session:
        constant: "15m"

  # these are the earlier scans by Amr
  - dicom_query:
      study_description:  "Menon^AS-MBN"
      patient_name: "*_AS*"
      study_date: 20240715-20241030
    select:
      - AppKI2.hTau.APOE*4_32-2M#2_AS120M2
      - AppKI2.hTau.APOE*4_32-2M#3_AS120M3
      - AppKI2.hTau.APOE*4_32-2M#4_AS120M4
      - AppKI2.hTau.APOE*4_30-4M#6_AS125bM6
      - AppKI2.hTau.APOE*4_30-4M#7_AS125bM7
      - AppKI2.hTau.APOE*4_30-4M#8_AS125bM8
      - AppKI2.hTau.APOE*4_30-4M#9_AS125bM9
      - AppKI2.hTau.APOE*4_30-5M#1_AS126bM1
      - AppKI2.hTau.APOE*4_30-5M#2_AS126bM2
      - AppKI2.hTau.APOE*4_30-5M#3_AS126bM3
      - AppKI2.hTau.APOE*4_30-5M#4_AS126bM4
      - AppKI2.hTau.APOE*4_30-6M#3_AS127M3
      - AppKI2.hTau.APOE*4_30-6M#4_AS127M4
      - AppKI2.hTau.APOE*4_30-6M#5_AS128M5
      - AppKI2.hTau.APOE*4_30-6M#6_AS128M6
      - AppKI2.hTau.APOE*4_34-1M#1_AS128M1
      - AppKI2.hTau.APOE*4_34-2M#4_AS131M4
      - AppKI2.hTau.APOE*4_34-2M#5_AS131M5
      - AppKI2.hTau.APOE*4_34-2M#6_AS131M6
      - AppKI2.hTau.APOE*4_27-1M#5_AS90M5
      - AppKI2.hTau.APOE*4_21-3M#5_AS98M5
      - AppKI2.hTau.APOE*4_25-2M#1_AS96M1
      - AppKI2.hTau.APOE*4_26-1M#5_AS89M5
      - AppKI2.hTau.APOE*4_24-3F#7_AS105M7
      - AppKI2.hTau.APOE*4_24-3F#8_AS105M8
      - AppKI2.hTau.APOE*4_27-3M#5_AS8103M5
    metadata_mappings:
      subject:
        source: PatientName
        pattern: '_(AS[0-9a-zA-Z]+[MF][0-9])$'
        sanitize: true
      session:
        source: StudyDate
 
query_kwargs:
  additional_tags:
 #   "00100030": PatientBirthDate
  


# 2. filter
study_filter_specs:
  include:
  exclude:
    - "subject != subject"                  # Exclude if subject is NaN
    - StudyInstanceUID == '2.16.756.5.5.200.8323328.46598.1721528003.6342' #sub-8103M5 scanned 20240720 (replaced by repeat scan 20240722)

  remap_sessions_by_date:
    # Enable/disable session remapping (REQUIRED if section is present)
    enable: true
    # Time units for intervals (OPTIONAL, default: 'months')
    # Options: 'days', 'months', 'years'
    units: 'months'
    
    # Rounding step for time intervals (OPTIONAL, default: 6)
    # For example, with units='months' and round_step=1:
    #   - Sessions will be labeled by rounded month intervals (0m, 1m, 2m, etc.)
    # Can also be a list for unequally-spaced timepoints, e.g. round_step: [0, 3, 6, 10]
    round_step: 1
    
    # Zero-pad session labels (OPTIONAL, default: false)
    # If true, pads session labels with leading zeros for proper alphanumeric sorting
    # Example: '00m', '06m', '12m' instead of '0m', '6m', '12m'
    #zero_pad: true
    
    # Reference date mode (OPTIONAL)
    # Default (commented out): Uses first session per subject as reference (baseline mode)
    # Alternative: Use PatientBirthDate to calculate age at scan
    # reference_col: 'PatientBirthDate'
    # reference_format: '%Y%m%d'
 
    # Mapping from numeric time intervals to session labels (OPTIONAL)
    # If not specified, generates labels like '0m', '6m', '12m' automatically
    # Custom mapping example (e.g., for time since baseline):
    time_to_label:
      0: '12m'
      1: '13p5m'
      2: '13p5m'
      3: '15m'
      4: '15m'
 
# 3. download
cfmm2tar_download_options: '--skip-derived'
merge_duplicate_studies: False  



# 4. convert
heudiconv_options: '--minmeta --use-enhanced-dicom --no-sanitize-jsons'
heuristic: heuristics/trident_15T.py
dcmconfig_json: resources/dcm2niix_config.json



# 5. fix 
post_convert_fixes:
  - name: phase_units
    pattern: "*/*_part-phase_*.json"
    action: update_json
    updates:
      Units: rad

  - name: reset_orientation
    pattern: "*/*.nii.gz"
    action: fix_orientation_quadruped


#intermediate output folders
stages:
  query: "results/lecanemab_late/0_query"
  filter: "results/lecanemab_late/1_filter"
  download: "results/lecanemab_late/2_download"
  convert: "results/lecanemab_late/3_convert"
  fix: "results/lecanemab_late/4_fix"

 
# Centralized download cache 
# Downloads are cached by StudyInstanceUID to avoid re-downloading
# the same data when subject/session mappings differ
# Default: "results/download_cache"
download_cache: "/nfs/trident3/mri/cfmm2bids/results/download_cache"



# EXTRA: Link to SPIM microscopy datasets
link_to_spim: False

#lightsheet bids data to link to
#  indexed by session number, so different batches can use different sessions
spim:
  exvivo15m3:
    out_path: micr/sub-{subject}_ses-{session}_sample-brain_acq-imaris4x_SPIM
    bids_dir: /nfs/trident3/lightsheet/prado/mouse_app_lecanemab_batch2/bids
    pybids_inputs:
      ome_zarr:
        filters:
          suffix: 'SPIM'
          extension: 'ome.zarr'
          sample: brain
          acquisition: 'imaris4x'
        wildcards:
          - subject
      json:
        filters:
          suffix: 'SPIM'
          extension: 'json'
          sample: brain
          acquisition: 'imaris4x'
        wildcards:
          - subject

