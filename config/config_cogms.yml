credentials_file: ~/.uwo_credentials.bd
final_bids_dir: "/nfs/scratch/akhan488/cogms-cfmm2bids/bids_gradcorr"

final_bids_uncorr_dir: "/nfs/scratch/akhan488/cogms-cfmm2bids/bids_nogradcorr"

#
# 1. query
search_specs:
  - dicom_query:
      study_description: Menon^CogMS
#      study_date: 20230101-20230301
    metadata_mappings:
      subject:
        source: PatientName
        pattern: '[sS][fF][cC][-_]?([0-9]+)'
        sanitize: true
        # constant: 'pilot'  # Use constant value for all subjects (OPTIONAL)



      session:
        source: StudyDate
#        source: PatientID
#        pattern: '[sS][fF][cC][-_]?[0-9]+[-_](.+)$'
        sanitize: true
        # constant: '15T'  # Use constant value for all sessions (OPTIONAL)
        # fillna: '01'
        # map:
        #  v2: '02'
        #  V2: '02'
        #
        #


# 2. filter
study_filter_specs:
  include:
  exclude:
#    - PatientID == '23.05.26-10:43:49-DST-1.3.12.2.1107.5.2.0.18932'
    - PatientID == 'TriggerTest'
    - subject != subject # if subject is nan 
    - StudyInstanceUID == '1.3.12.2.1107.5.2.34.18932.30000018071014504151500000004' #physio log only

  # Optional: Remap sessions based on study date ordering
  # Uncomment and configure to use time-based session labels
  remap_sessions_by_date:
    enable: true
    units: 'months'
    round_step: 6
    # Default behavior: Time since first session (baseline mode)
    # Sessions labeled as '0m', '6m', '12m', etc.
    
    # Zero-pad session labels (optional, default: false)
    # Set to true to ensure proper alphanumeric sorting of sessions
    # Example: '00m', '06m', '12m' instead of '0m', '6m', '12m'
    # zero_pad: false
    
    # Alternative: Calculate age at scan using birth date
    # Uncomment the following lines to use PatientBirthDate as reference:
    # reference_col: 'PatientBirthDate'
    # reference_format: '%Y%m%d'
    
    # Custom label mapping (optional)
    # If you prefer custom labels like 'baseline' instead of '0m':
    time_to_label:
      0: 'baseline'
  exclude_post_remap:
    - subject == '103' and session =='6m' #no dicoms error
    - subject == '104' and session =='baseline' #no dicoms error

       

# 3. download
cfmm2tar_download_options: ''
merge_duplicate_studies: True


# 4. convert
heudiconv_options: '--minmeta '
heuristic: heuristics/Menon_CogMSv2.py
dcmconfig_json: resources/dcm2niix_config.json
base_heuristics:
  - heuristics/cfmm_base.py

# 5. fix 
post_convert_fixes:
  - name: remove_rois
    pattern: "anat/*ROI1.*"
    action: remove

  - name: remove_scans_tsv
    pattern: "*scans.tsv"
    action: remove

  - name: sa2rage_metadata
    pattern: "fmap/*TB1SRGE.json"
    action: update_json
    updates:
      NumberShots: 1
      RepetitionTimeExcitation: 0.002
      RepetitionTimePreparation: 2.4

  - name: mp2rage_metadata
    pattern: "anat/*inv-*MP2RAGE.json"
    action: update_json
    updates:
      NumberShots: 1  # Single-shot
      RepetitionTimeExcitation: 0.0079 # Echo spacing from the protocol pdf
      RepetitionTimePreparation: 6 

  - name: phase_units
    pattern: "*/*part-phase*.json"
    action: update_json
    updates:
      Units: rad

  - name: phase_units_
    pattern: "*/*phase.json"
    action: update_json
    updates:
      Units: rad

  - name: remove_dupe_t1maps
    pattern: "*/*run-*_*T1map.nii.gz"
    action: remove_duplicate_niftis

  - name: remove_dupe_t1w
    pattern: "*/*run-*_*T1w.nii.gz"
    action: remove_duplicate_niftis

  - name: remove_dupe_mp2rage
    pattern: "*/*run-*_*MP2RAGE.nii.gz"
    action: remove_duplicate_niftis

  - name: remove_unneeded_fmap_phasediff
    pattern: "fmap/*phasediff.*"
    action: remove

  - name: remove_unneeded_fmap_magnitude
    pattern: "fmap/*magnitude[12].*"
    action: remove

  - name: pepolar_fmap
    pattern: "fmap/*epi.json"
    action: update_json
    updates:
      B0FieldIdentifier: pepolar_rest

  - name: pepolar_bold
    pattern: "func/*bold.json"
    action: update_json
    updates:
      B0FieldSource: pepolar_rest




# ============================================================================
# 6. GRADCORRECT STAGE - Gradient nonlinearity correction (OPTIONAL)
# ============================================================================
# Apply gradient nonlinearity correction using the gradcorrect BIDS app.
# When enabled, this stage runs after the fix stage and the corrected
# subject/session directories are used for the final BIDS assembly.
# Requires Singularity/Apptainer to run the container; pass
# --use-singularity (or --use-apptainer) to Snakemake when running.

gradcorrect:
  # Enable gradient nonlinearity correction (OPTIONAL, default: false)
  enable: true

  # Path to gradient coefficient file (REQUIRED when enable is true;
  # the workflow will raise an error at startup if this is missing)
  grad_coeff_file: "/nfs/khan/software/gradcorrect/coeff_AC84.grad"


  create_bids_uncorr: true


bidsignore:
  - '*_acq-b1Div_*'
  - '*_b1DivImg.*'
  - '*_TB1Map.*'
  - '*echo*T1map.*'


# intermediate output folders
stages:
  query: "results/0_query"
  filter: "results/1_filter"
  download: "/nfs/scratch/akhan488/cogms-cfmm2bids/results/2_download"
  convert: "/nfs/scratch/akhan488/cogms-cfmm2bids/results/3_convert"
  fix: "/nfs/scratch/akhan488/cogms-cfmm2bids/results/4_fix"
